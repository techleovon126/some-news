<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>techleovon126 的主页</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #0d1117;
    color: #e6edf3;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 16px;
    padding: 40px 36px;
    max-width: 480px;
    width: 100%;
    text-align: center;
  }
  .avatar {
    width: 72px; height: 72px;
    border-radius: 50%;
    background: #7F77DD;
    color: #fff;
    font-size: 30px; font-weight: 600;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 18px;
  }
  h1 { font-size: 22px; font-weight: 600; margin-bottom: 6px; }
  .sub { color: #8b949e; font-size: 14px; margin-bottom: 24px; }
  .intro { font-size: 15px; line-height: 1.7; color: #c9d1d9; margin-bottom: 26px; }
  .btn {
    display: inline-block;
    background: #238636;
    color: #fff;
    text-decoration: none;
    font-size: 14px;
    padding: 10px 20px;
    border-radius: 8px;
    margin: 0 6px 8px;
  }
  .btn.ghost { background: transparent; border: 1px solid #30363d; color: #c9d1d9; }
  .btn:hover { filter: brightness(1.15); }
  footer { margin-top: 26px; font-size: 12px; color: #8b949e; }
</style>
</head>
<body>
  <div class="card">
    <div class="avatar">T</div>
    <h1>techleovon126</h1>
    <p class="sub">@techleovon126 · GitHub</p>
    <p class="intro">
      你好，这是我的第一个 GitHub Pages 页面。<br>
      正在学习 GitHub 和写代码，欢迎围观。
    </p>
    <a class="btn" href="https://github.com/techleovon126">我的 GitHub</a>
    <a class="btn ghost" href="https://github.com/techleovon126/some-news">some-news 仓库</a>
    <a class="btn" href="games.html">进入解谜站</a>
    <footer>Powered by GitHub Pages</footer>
  </div>
</body>
</html>
