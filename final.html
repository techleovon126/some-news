<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>终点 · some-news</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #0d1117; color: #e6edf3;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .card {
    background: #161b22; border: 1px solid #30363d; border-radius: 16px;
    padding: 40px 36px; max-width: 500px; width: 100%; text-align: center;
  }
  .badge {
    display: inline-block; font-size: 12px; color: #3fb950;
    border: 1px solid #3fb950; border-radius: 999px; padding: 4px 12px; margin-bottom: 16px;
  }
  h1 { font-size: 24px; font-weight: 600; margin-bottom: 16px; }
  .msg-line {
    background: #0d1117; border: 1px dashed #30363d; border-radius: 10px;
    padding: 18px; font-size: 15px; line-height: 1.8; margin-bottom: 22px; color: #c9d1d9;
  }
  .msg-line b { color: #3fb950; }
  .btn {
    display: inline-block; background: #238636; color: #fff; text-decoration: none;
    font-size: 14px; padding: 10px 20px; border-radius: 8px; margin: 6px 6px 0;
  }
  .btn.ghost { background: transparent; border: 1px solid #30363d; color: #c9d1d9; }
  .btn:hover { filter: brightness(1.15); }
</style>
</head>
<body>
  <div class="card">
    <div class="badge">第 3 / 3 层 · 终点</div>
    <h1>你找到了！</h1>
    <p class="msg-line">信号终点是一句留言：<br><b>“欢迎来到我的小宇宙，探索者。”</b><br><br>这是 techleovon126 的第一个解谜站，恭喜通关。</p>
    <a class="btn" href="index.html">返回主页</a>
    <a class="btn ghost" href="games.html">再玩一次</a>
  </div>
</body>
</html>
